<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>活动方案生成助手</title>
  <link rel="stylesheet" href="./proposal.css" />
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <aside class="input-pane">
        <header class="app-header">
          <div class="eyebrow">Proposal Copilot</div>
          <h1>活动方案生成助手</h1>
          <p>输入条件，一键生成路演级 PPT。</p>
        </header>

        <form id="proposal-form" class="form-grid">
          <section class="template-section" aria-labelledby="template-heading">
            <h2 id="template-heading">PPT 模板预设</h2>
            <label>
              <span>内置模板</span>
              <select id="template-preset">
                <option value="strategy">策略咨询型</option>
                <option value="brand">品牌发布型</option>
                <option value="commerce">商业快闪型</option>
                <option value="enterprise">稳重政企型</option>
              </select>
            </label>
            <div id="preset-summary" class="template-summary" aria-live="polite"></div>
          </section>

          <section>
            <h2>项目条件</h2>
            <label>
              <span>活动号类型</span>
              <select id="activity-account">
                <option value="beauty">美业大健康微商活动号</option>
                <option value="campus">校园活动号</option>
                <option value="construction">建筑行业活动号</option>
                <option value="mall">商超美陈号</option>
                <option value="enterprise">企业年会团建号</option>
              </select>
            </label>
            <div id="activity-prompt-summary" class="activity-summary" aria-live="polite"></div>
            <label>
              <span>甲方行业</span>
              <input id="client-industry" value="美业大健康品牌" />
            </label>
            <label>
              <span>活动主 KV / 主视觉图</span>
              <input id="key-visual-reference" type="file" accept="image/*" />
              <div class="file-hint">可上传海报助手生成的主视觉，用于封面和整体视觉方向。</div>
            </label>
            <div class="field-row">
              <label>
                <span>活动主题</span>
                <input id="event-title" value="年度品牌招商峰会" />
              </label>
              <label>
                <span>副标题</span>
                <input id="event-subtitle" value="品牌势能提升与招商转化活动方案" />
              </label>
            </div>
            <label>
              <span>活动目的</span>
              <textarea id="event-objective" rows="4">提升品牌势能，完成招商转化，增强私域客户信任，并通过现场内容形成朋友圈传播。</textarea>
            </label>
          </section>

          <section>
            <h2>活动概况</h2>
            <label>
              <span>活动主题</span>
              <select id="activity-theme-option"></select>
              <input id="theme-direction" class="conditional-input" value="年度品牌招商峰会" />
            </label>
            <label>
              <span>方案风格</span>
              <select id="proposal-style">
                <option value="自动判断">自动判断</option>
                <option value="高端商务型">高端商务型</option>
                <option value="创意爆点型">创意爆点型</option>
                <option value="务实落地型">务实落地型</option>
                <option value="竞标提案型">竞标提案型</option>
                <option value="品牌营销型">品牌营销型</option>
                <option value="稳重政企型">稳重政企型</option>
                <option value="__custom__">其他</option>
              </select>
              <input id="proposal-style-custom" class="conditional-input" value="银色科技感，克制高级，突出舞美搭建落地能力" />
            </label>
            <div class="field-row">
              <label>
                <span>活动时间</span>
                <input id="event-time" value="2026 年 6 月" />
              </label>
              <label>
                <span>活动地点</span>
                <input id="event-location" value="城市会议中心 / 酒店宴会厅" />
              </label>
            </div>
            <div class="field-row">
              <label>
                <span>预算区间</span>
                <input id="budget-range" value="10-30 万" />
              </label>
              <label>
                <span>预计人数</span>
                <input id="headcount" value="200-300 人" />
              </label>
            </div>
            <label>
              <span>活动对象</span>
              <select id="activity-object-option"></select>
              <input id="target-audience" class="conditional-input" value="品牌代理商、意向加盟客户、私域核心客户、行业达人" />
            </label>
            <label>
              <span>活动形式</span>
              <select id="activity-form-option"></select>
              <input id="activity-form" class="conditional-input" value="品牌招商峰会 + 产品体验 + 签约转化" />
            </label>
            <label>
              <span>场地类型</span>
              <input id="venue-type" value="室内会议厅 + 签到展示区 + 洽谈区" />
            </label>
            <label>
              <span>上传场地图</span>
              <input id="venue-map-reference" type="file" accept="image/*" />
              <div class="file-hint">用于区域规划、动线设计和搭建方案页。</div>
            </label>
            <div class="execution-module">
              <div class="module-head">
                <span>活动执行模块</span>
                <strong>按生产执行拆分</strong>
              </div>
              <label>
                <span>一天执行流程</span>
                <textarea id="execution-flow" rows="3">前期完成主题视觉、邀约物料、现场搭建图和执行排期；活动当天完成签到接待、舞台控场、产品体验、签约转化；活动后输出复盘素材和二次传播内容。</textarea>
              </label>
              <label>
                <span>演出 / 环节节点</span>
                <textarea id="execution-program" rows="3">开场签到、主持开场、品牌主讲、产品体验、互动抽奖、签约仪式、合影留念。</textarea>
              </label>
              <div class="field-row">
                <label>
                  <span>拍摄安排</span>
                  <textarea id="execution-shooting" rows="3">主视觉打卡、领导嘉宾、签约仪式、观众互动、现场全景、朋友圈传播素材。</textarea>
                </label>
                <label>
                  <span>人员 / 运营安排</span>
                  <textarea id="execution-operation" rows="3">项目统筹、舞台监督、搭建负责人、签到接待、摄影摄像、物料管理、应急巡场。</textarea>
                </label>
              </div>
            </div>
          </section>

          <section>
            <h2>执行需求</h2>
            <div class="field-row">
              <label>
                <span>是否需要舞台</span>
                <select id="need-stage">
                  <option value="需要">需要</option>
                  <option value="不需要">不需要</option>
                  <option value="待定">待定</option>
                </select>
              </label>
              <label>
                <span>是否需要美陈</span>
                <select id="need-display">
                  <option value="需要">需要</option>
                  <option value="不需要">不需要</option>
                  <option value="待定">待定</option>
                </select>
              </label>
            </div>
            <div class="field-row">
              <label>
                <span>是否需要宣发引流</span>
                <select id="need-promotion">
                  <option value="需要">需要</option>
                  <option value="不需要">不需要</option>
                  <option value="待定">待定</option>
                </select>
              </label>
            </div>
            <label>
              <span>公司能力背书</span>
              <textarea id="company-capability" rows="5">公司主营活动策划，舞美搭建执行拥有自有搭建团队，可承接美陈类、会议类物料搭建、展会搭建，并配备自有舞台活动设备，具备多年专业落地经验和品牌背书。</textarea>
            </label>
            <label>
              <span>补充要求</span>
              <textarea id="extra-requirements" rows="4">方案需要新颖、有创意、可落地、有差异化，适合直接向甲方路演汇报。</textarea>
            </label>
            <div class="field-stack">
              <label class="checkbox-line">
                <input id="include-3d" type="checkbox" />
                <span>加入 3D 美陈 / 包装参考图</span>
              </label>
              <div id="three-d-fields" class="three-d-fields" hidden>
                <label>
                  <span>3D 风格说明</span>
                  <textarea id="three-d-brief" rows="3">用于美陈包装、舞美氛围、DP 点或空间装置展示，风格要与活动主题一致，尽量有质感和落地感。</textarea>
                </label>
                <label>
                  <span>上传 3D 参考图</span>
                  <input id="three-d-reference" type="file" accept="image/*" />
                  <div class="file-hint">需上传参考图。</div>
                </label>
              </div>
            </div>
          </section>

          <section class="action-bar">
            <label class="checkbox-line">
              <input id="generate-images" type="checkbox" checked />
              <span>完整 PPT 生成全部配图</span>
            </label>
            <label class="checkbox-line">
              <input id="generate-build-plan" type="checkbox" />
              <span>生成活动搭建方案</span>
            </label>
            <label class="checkbox-line">
              <input id="generate-runbook-plan" type="checkbox" />
              <span>生成活动统筹方案</span>
            </label>
            <div id="workflow-stage" class="workflow-note">先草稿，后完整 PPT。</div>
            <div id="generation-progress" class="progress-panel" hidden>
              <div class="progress-head">
                <span id="progress-label">生成进度</span>
                <strong id="progress-percent">0%</strong>
              </div>
              <div class="progress-track" aria-hidden="true">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <div id="progress-detail" class="progress-detail">等待开始。</div>
            </div>
            <button type="button" id="generate-proposal">生成草稿</button>
            <button type="button" id="confirm-generation" class="confirm" disabled>生成完整 PPT</button>
            <button type="button" id="export-ppt" class="secondary">导出 PPT</button>
          </section>
        </form>
      </aside>

      <section class="output-pane">
        <div class="status-row">
          <div>
            <div class="eyebrow">Deck Preview</div>
            <h2 id="deck-title">等待生成方案</h2>
          </div>
          <span id="proposal-status" class="status-pill">未生成</span>
        </div>
        <div id="deck-meta" class="deck-meta">草稿与 PPT 预览区。</div>
        <section id="draft-review" class="draft-review" hidden>
          <div class="draft-review-head">
            <div>
              <div class="eyebrow">Draft Review</div>
              <h3>草稿预览</h3>
            </div>
            <span id="draft-template" class="template-chip"></span>
          </div>
          <p id="draft-summary" class="draft-summary"></p>
          <div id="draft-visuals" class="draft-visuals"></div>
        </section>
        <div id="slides-preview" class="slides-preview"></div>
      </section>
    </section>
  </main>

  <script src="./proposal.js"></script>
</body>
</html>
